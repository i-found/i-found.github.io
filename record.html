    <!-- 鼠标点击产生爱心 -->
    <script type="text/javascript">
    (function(window,document,undefined){
        var hearts = [];

        window.requestAnimationFrame = (function(){
            return window.requestAnimationFrame ||
            window.webkitRequestAnimationFrame ||
            window.mozRequestAnimationFrame ||
             window.oRequestAnimationFrame ||
             window.msRequestAnimationFrame ||
             function (callback){
                 setTimeout(callback,1000/60);
             }
        })();

        init();

        function init(){
            css(".heart{width: 10px;height: 10px;position: fixed;background: #f00;transform: rotate(45deg);-webkit-transform: rotate(45deg);-moz-transform: rotate(45deg);}.heart:after,.heart:before{content: '';width: inherit;height: inherit;background: inherit;border-radius: 50%;-webkit-border-radius: 50%;-moz-border-radius: 50%;position: absolute;}.heart:after{top: -5px;}.heart:before{left: -5px;}");
            attachEvent();
            gameloop();
        }

        function gameloop(){
            for(var i=0;i<hearts.length;i++){
                if(hearts[i].alpha <=0){
                    document.body.removeChild(hearts[i].el);
                    hearts.splice(i,1);
                    continue;
                 }

                 hearts[i].y--;
                 hearts[i].scale += 0.004;
                 hearts[i].alpha -= 0.013;
                 hearts[i].el.style.cssText = "left:"+hearts[i].x+"px;top:"+hearts[i].y+"px;opacity:"+hearts[i].alpha+";transform:scale("+hearts[i].scale+","+hearts[i].scale+") rotate(45deg);background:"+hearts[i].color;
            }

            requestAnimationFrame(gameloop);
        }

        function attachEvent(){
            var old = typeof window.onclick==="function" && window.onclick;
            window.onclick = function(event){
                old && old();
                createHeart(event);
            }
        }

        function createHeart(event){
            var d = document.createElement("div");
            d.className = "heart";
            hearts.push({
                el : d,
                x : event.clientX - 5,
                y : event.clientY - 5,
                scale : 1,
                alpha : 1,
                color : randomColor()
            });

            document.body.appendChild(d);
        }

        function css(css){
            var style = document.createElement("style");
            style.type="text/css";
            try{
                style.appendChild(document.createTextNode(css));
            }
            catch(ex){
                style.styleSheet.cssText = css;
            }

            document.getElementsByTagName('head')[0].appendChild(style);
        }

        function randomColor(){
            return "rgb("+(~~(Math.random()*255))+","+(~~(Math.random()*255))+","+(~~(Math.random()*255))+")";
        }

    })(window,document);

    </script>

    <script type="text/javascript">
    var days=new  Array ("日", "一", "二", "三", "四", "五", "六");
    function showDT() {
      var currentDT = new Date();
      var y,m,date,day,hs,ms,ss,theDateStr;
      y = currentDT.getFullYear(); //四位整数表示的年份
      m = (currentDT.getMonth()+1); //月
      date = currentDT.getDate(); //日
      day = currentDT.getDay(); //星期
      hs = currentDT.getHours(); //时
      ms = currentDT.getMinutes(); //分
      ss = currentDT.getSeconds(); //秒
      theDateStr = y+"年"+m+"月"+date+"日 星期"+days[day]+" "+hs+":"+ms+":"+ss;
      theYearStr = y;
      theDayStr = date;
      /* 记录页没有这几个时钟元素，取不到就跳过（否则每秒抛 null 错误） */
      var elY = document.getElementById("theYear");  if (elY) elY.innerHTML = theYearStr;
      var elD = document.getElementById("theDate");  if (elD) elD.innerHTML = theDayStr;
      var elC = document.getElementById("theClock"); if (elC) elC.innerHTML = theDateStr;
      // setTimeout 在执行时,是在载入后延迟指定时间后,去执行一次表达式,仅执行一次
      window.setTimeout( showDT, 1000);
    }
    </script>

<script>
// ========== 记录功能 JS ==========
  var STORAGE_KEY = 'suihe_records';
  var TOKEN_KEY = 'suihe_records_key';
  var API_BASE = 'https://meimei.qzz.io';
  var PENDING_DELETES_KEY = 'suihe_pending_deletes';
  var records = [];
  var lastCloudRecords = [];   // 最近一次从云端拉到的快照，导入时用来判断哪些记录真的需要上传
  var editingImages = []; // 编辑模式下的图片数组（支持多张）
  var editingRecordId = null; // 编辑模式下的记录 ID

  // ========== IndexedDB 存储（解决 5MB localStorage 限制）==========
  var DB_NAME = 'suihe_records_db';
  var DB_VERSION = 1;
  var DB_STORE = 'records';
  var dbInstance = null;

  function openDB() {
    if (dbInstance) return Promise.resolve(dbInstance);
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains(DB_STORE)) {
          db.createObjectStore(DB_STORE);
        }
      };
      req.onsuccess = function(e) { dbInstance = e.target.result; resolve(dbInstance); };
      req.onerror = function(e) { reject(e.target.error); };
    });
  }

  function idbGet(key) {
    return openDB().then(function(db) {
      return new Promise(function(resolve, reject) {
        var tx = db.transaction(DB_STORE, 'readonly');
        var req = tx.objectStore(DB_STORE).get(key);
        req.onsuccess = function() { resolve(req.result); };
        req.onerror = function() { reject(req.error); };
      });
    });
  }

  function idbSet(key, value) {
    return openDB().then(function(db) {
      return new Promise(function(resolve, reject) {
        var tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(value, key);
        tx.oncomplete = function() { resolve(); };
        tx.onerror = function() { reject(tx.error); };
      });
    });
  }

  // 保存到存储：优先 IndexedDB，失败时回退 localStorage（仅小数据）
  function saveToStorage() {
    var data = JSON.stringify(records);
    return idbSet(STORAGE_KEY, records).catch(function(e) {
      // 回退到 localStorage（但仅当数据较小时）
      try {
        if (data.length < 2 * 1024 * 1024) {
          localStorage.setItem(STORAGE_KEY, data);
        } else {
          throw e;
        }
      } catch(e2) {
        throw e2;
      }
    });
  }

  // ========== Token 管理 ==========
  function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
  function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
  function hasToken() { return !!getToken(); }

  function updateSyncUI() {
    var btn = document.getElementById('syncSettingsBtn');
    if (hasToken()) {
      btn.classList.add('configured');
      btn.title = '已配置同步';
    } else {
      btn.classList.remove('configured');
      btn.title = '同步设置';
    }
  }

  // 显示同步状态
  function showSyncStatus(msg, type) {
    var el = document.getElementById('syncStatus');
    el.textContent = msg;
    el.style.display = 'block';
    el.className = 'sync-status ' + (type || '');
  }

  // ========== D1 云端 API（每条记录单独读写，不再整文件覆盖）==========
  function d1API(method, path, body) {
    var token = getToken();
    var headers = { 'X-Records-Key': token };
    var opts = { method: method, headers: headers };
    if (body) {
      opts.body = JSON.stringify(body);
      headers['Content-Type'] = 'application/json';
    }
    return fetch(API_BASE + path, opts).then(function(res) {
      if (res.status === 401) {
        var err = new Error('密钥不正确');
        err.status = 401;
        throw err;
      }
      if (!res.ok) {
        return res.text().then(function(t) { throw new Error('HTTP ' + res.status); });
      }
      return res.json();
    });
  }

  // 从云端拉取记录，并换算成页面内部格式（id 为数字，time/updatedTime 为毫秒时间戳）
  function loadFromD1() {
    if (!hasToken()) return Promise.resolve(null);
    showSyncStatus('同步中…', 'syncing');
    return d1API('GET', '/api/records').then(function(data) {
      var list = (data && data.records) || [];
      var out = list.map(function(r) {
        var idNum = /^-?\d+$/.test(String(r.id)) ? parseInt(r.id, 10) : r.id;
        /* 云端记录同样补齐两个时间：created_at → time，updated_at → updatedTime */
        return normalizeRecord({
          id: idNum,
          title: r.title || '',
          text: r.text || '',
          images: r.images || [],
          time: r.created_at || idNum,
          updatedTime: r.updated_at || r.created_at || idNum
        });
      });
      showSyncStatus('云端已拉取 ✓', 'success');
      setTimeout(function() { showSyncStatus('', ''); }, 2000);
      return out;
    }).catch(function(err) {
      if (err.status === 401) {
        setToken('');
        updateSyncUI();
        showSyncStatus('密钥不正确，请重新设置（本地数据不受影响）', 'error');
        return null;
      }
      showSyncStatus('同步失败: ' + err.message, 'error');
      return null;
    });
  }

  // 推送一条记录到云端（新增和编辑都走 POST，云端按 id 覆盖，不会整文件重写）
  function pushRecordToD1(record) {
    if (!hasToken()) return Promise.resolve();
    showSyncStatus('同步中…', 'syncing');
    return d1API('POST', '/api/records', {
      id: String(record.id),
      title: record.title || '',
      text: record.text || '',
      images: record.images || [],
      created_at: record.time || record.id,
      updated_at: record.updatedTime || record.time || record.id
    }).then(function() {
      /* 推送成功就把这条写进云端快照，后续导入/合并判断才不会误判 */
      lastCloudRecords = lastCloudRecords.filter(function(x) { return String(x.id) !== String(record.id); });
      lastCloudRecords.push(record);
      showSyncStatus('已同步 ✓', 'success');
      setTimeout(function() { showSyncStatus('', ''); }, 2000);
    }).catch(function(err) {
      if (err.status === 401) {
        setToken('');
        updateSyncUI();
        showSyncStatus('密钥不正确，请重新设置（本地数据不受影响）', 'error');
        return;
      }
      showSyncStatus('同步失败: ' + err.message, 'error');
    });
  }

  // 待重试删除：离线删记录时记下来，联网后初始化时重试，避免云端记录复活
  function getPendingDeletes() {
    try {
      var raw = localStorage.getItem(PENDING_DELETES_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch(e) { return []; }
  }
  function setPendingDeletes(list) {
    try { localStorage.setItem(PENDING_DELETES_KEY, JSON.stringify(list)); } catch(e) {}
  }
  function addPendingDelete(id) {
    var list = getPendingDeletes();
    var key = String(id);
    if (list.indexOf(key) === -1 && list.indexOf(id) === -1) list.push(key);
    setPendingDeletes(list);
  }
  function removePendingDelete(id) {
    var list = getPendingDeletes().filter(function(x) { return String(x) !== String(id); });
    setPendingDeletes(list);
  }
  function isPendingDelete(id) {
    var list = getPendingDeletes();
    return list.indexOf(String(id)) !== -1 || list.indexOf(id) !== -1;
  }

  // 补推本地记录：把本地独有、本地更新的记录推到云端，离线删除的重试删除
  // 返回 {pushed, failed, deletedRetried, lastError}
  function pushLocalChanges(localBefore, cloudBefore) {
    var cloudMap = {};
    (cloudBefore || []).forEach(function(r) { cloudMap[r.id] = r; });
    var localMap = {};
    (localBefore || []).forEach(function(r) { localMap[r.id] = r; });
    var toPush = [];
    records.forEach(function(r) {
      var cloud = cloudMap[r.id];
      if (!cloud) {
        toPush.push(r);
      } else {
        var local = localMap[r.id];
        if (local) {
          var localVer = timeToMs(local.updatedTime) || timeToMs(local.time) || 0;
          var cloudVer = timeToMs(cloud.updatedTime) || timeToMs(cloud.time) || 0;
          if (localVer > cloudVer) toPush.push(r);
        }
      }
    });
    var pending = getPendingDeletes();
    var chain = Promise.resolve();
    var result = { pushed: 0, failed: 0, deletedRetried: 0, lastError: '' };
    toPush.forEach(function(r) {
      chain = chain.then(function() {
        if (!hasToken()) return;
        showSyncStatus('正在补同步本地记录…', 'syncing');
        return d1API('POST', '/api/records', {
          id: String(r.id),
          title: r.title || '',
          text: r.text || '',
          images: r.images || [],
          created_at: r.time || r.id,
          updated_at: r.updatedTime || r.time || r.id
        }).then(function() { result.pushed++; }).catch(function(err) {
          result.failed++;
          result.lastError = err.message || '网络错误';
          if (err.status === 401) {
            setToken('');
            updateSyncUI();
          }
        });
      });
    });
    pending.forEach(function(delId) {
      chain = chain.then(function() {
        if (!hasToken()) return;
        return d1API('DELETE', '/api/records/' + encodeURIComponent(String(delId))).then(function() {
          removePendingDelete(delId);
          result.deletedRetried++;
        }).catch(function(err) {
          result.lastError = err.message || '网络错误';
          if (err.status === 401) {
            setToken('');
            updateSyncUI();
          }
        });
      });
    });
    return chain.then(function() { return result; });
  }

  // 从云端删除一条记录（软删除，云端不再返回它），调用方负责处理成功/失败
  function deleteRecordFromD1(id) {
    if (!hasToken()) return Promise.resolve();
    return d1API('DELETE', '/api/records/' + encodeURIComponent(String(id)));
  }

  // ========== 记录管理 ==========

  // 加载记录（IndexedDB 优先，localStorage 兜底）
  function loadRecords() {
    // 尝试 IndexedDB
    if (window.indexedDB) {
      idbGet(STORAGE_KEY).then(function(data) {
        if (Array.isArray(data)) {
          records = data.map(normalizeRecord);   // 旧数据补齐创建/修改时间
          healBatchTimes(records);               // 修正被同步批量刷新的「修改时间」
          saveToStorage().catch(function() {});  // 修完存回去，下次无需再算
          render();
        }
      }).catch(function() {
        // 失败回退 localStorage
        tryLoadFromLocalStorage();
      });
    } else {
      tryLoadFromLocalStorage();
    }
    // 同步尝试 localStorage（首次迁移）
    tryLoadFromLocalStorage();
  }

  function tryLoadFromLocalStorage() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length && records.length === 0) {
          records = parsed.map(normalizeRecord);
          healBatchTimes(records);
          render();
          // 迁移到 IndexedDB
          saveToStorage().catch(function() {});
        }
      }
    } catch(e) {
      // 旧数据坏了，清掉
      try { localStorage.removeItem(STORAGE_KEY); } catch(e2) {}
    }
  }

  // 保存到本地存储 + 把变动的记录推到云端（异步，只推变动的那几条）
  function saveRecords(changed) {
    saveToStorage().then(function() {
      showSyncStatus('已保存 ' + records.length + ' 条记录', 'success');
      var s = document.getElementById('syncStatus');
      if (s) { s.style.color = '#4CAF50'; s.style.fontSize = '13px'; s.style.display = 'block'; }
    }).catch(function(e) {
      showSyncStatus('本地存储失败: ' + e.message, 'error');
    });
    if (changed && changed.length) {
      var chain = Promise.resolve();
      changed.forEach(function(r) {
        chain = chain.then(function() { return pushRecordToD1(r); });
      });
    }
  }

  // 格式化时间（兼容多种格式：数字时间戳 / ISO字符串 / 已格式化的中文串）
  function formatTime(ts) {
    if (!ts) return '';
    // 如果已经是 "2026年7月31日 19:11" 这种格式，直接返回
    if (typeof ts === 'string' && ts.indexOf('年') !== -1) {
      return ts;
    }
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    var pad = function(n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // 渲染所有记录
  function render() {
    var container = document.getElementById('recordsContainer');
    var searchBar = document.getElementById('searchBar');
    var searchTerm = searchBar ? searchBar.value.trim().toLowerCase() : '';
    var filtered = records;

    if (searchTerm) {
      filtered = records.filter(function(r) {
        var inTitle = r.title && r.title.toLowerCase().indexOf(searchTerm) !== -1;
        var inText = r.text && r.text.toLowerCase().indexOf(searchTerm) !== -1;
        var inOcr = r.ocrText && r.ocrText.toLowerCase().indexOf(searchTerm) !== -1;
        return inTitle || inText || inOcr;
      });
    }

    if (filtered.length === 0) {
      container.innerHTML = '<div class="records-empty">' + (searchTerm ? '没有匹配的记录' : '还没有记录，点击上方按钮添加第一条吧~') + '</div>';
      return;
    }

    var html = '';
    for (var i = filtered.length - 1; i >= 0; i--) {
      var r = filtered[i];
      html += '<div class="record-card" data-id="' + r.id + '" id="record-' + r.id + '">';
      html += '<button class="record-edit" data-id="' + r.id + '" title="编辑">✎</button>';
      html += '<button class="record-delete" data-id="' + r.id + '" title="删除">×</button>';
      if (r.title) {
        html += '<div class="record-title">' + highlightText(r.title, searchTerm) + '</div>';
      }
      html += '<div class="record-text">' + highlightText(r.text, searchTerm) + '</div>';
      var imgs = displayImages(r);
      if (imgs.length) {
        html += '<div class="record-images">';
        for (var ii = 0; ii < imgs.length; ii++) {
          /* 加载失败（比如早期记录的云端图片已被删除）就显示占位块，不留破图图标 */
          html += '<img class="record-image" src="' + imgs[ii] + '" alt="图片已失效" data-src="' + imgs[ii] + '" onerror="this.classList.add(\'img-broken\');this.removeAttribute(\'src\');">';
        }
        html += '</div>';
      }
      /* 只显示一个时间：改过就显示「修改于」，没改过就显示创建时间 */
      html += '<span class="record-time">' + (isModifiedRecord(r) ? '修改于 ' + formatTime(r.updatedTime) : formatTime(r.time || r.id)) + '</span>';
      html += '<div style="clear:both;"></div>';
      html += '</div>';
    }
    container.innerHTML = html;
  }

  // 搜索关键词高亮
  function highlightText(text, keyword) {
    if (!keyword) return escapeHtml(text);
    var esc = escapeHtml(text);
    return esc.replace(new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark class="search-hl">$1</mark>');
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  // 打开弹窗
  function openModal(recordId) {
    // 关闭搜索弹窗并清空搜索词，避免保存后记录被过滤
    var searchPopup = document.getElementById('searchPopup');
    var searchIconBtn = document.getElementById('searchIconBtn');
    var searchInput = document.getElementById('searchBar');
    if (searchPopup) searchPopup.classList.remove('open');
    if (searchIconBtn) searchIconBtn.classList.remove('active');
    if (searchInput) searchInput.value = '';

    editingRecordId = recordId || null;
    var now = Date.now();
    if (editingRecordId) {
      // 编辑模式：填充已有数据
      var record = findRecord(editingRecordId);
      if (record) {
        document.getElementById('recordTitle').value = record.title || '';
        document.getElementById('recordText').value = record.text || '';
        /* 编辑弹窗里显示这条记录的创建时间（列表里显示的是"修改于"，这里补回创建时间） */
        document.getElementById('modalTime').textContent = '创建于 ' + formatTime(record.time || record.id);
        var editImgs = displayImages(record);
        if (editImgs.length) {
          editingImages = editImgs.slice();
          renderImagePreview();
        } else {
          editingImages = [];
          document.getElementById('imagePreviewArea').style.display = 'none';
          document.getElementById('imagePreviewGrid').innerHTML = '';
        }
      }
    } else {
      // 新增模式
      document.getElementById('recordText').value = '';
      document.getElementById('recordTitle').value = '';
      document.getElementById('modalTime').textContent = '创建于 ' + formatTime(now);
      editingImages = [];
      document.getElementById('imagePreviewArea').style.display = 'none';
      document.getElementById('imagePreviewGrid').innerHTML = '';
    }
    document.getElementById('recordModal').classList.add('show');
    document.getElementById('recordTitle').focus();
  }

  // 查找记录
  function findRecord(id) {
    for (var i = 0; i < records.length; i++) {
      if (records[i].id === id) return records[i];
    }
    return null;
  }

  // ========== 图片字段维护 ==========
  // 是否内嵌图片数据（data:image/...;base64,...）
  function isDataUrl(s) {
    return typeof s === 'string' && s.indexOf('data:') === 0;
  }

  /* ========== 时间字段：以记录 id 作为创建时间的锚点 ==========
     新建记录时 id = Date.now()，所以 id 本身就是可靠的创建时间戳。
     云端会把 created_at / updated_at 写成"同步那一刻"，于是卡片会莫名显示「修改于今天」。
     这里统一校正，保证同一份数据每次算出来的时间都一样：
       · 创建时间偏离 id 超过 1 分钟 → 判定被改写，回退成 id
       · 修改时间与"被改写的创建时间"相同（同一批写进去的）→ 一起回退成 id
       · 多条记录在同一分钟被"修改" → 视为批量污染，回退成创建时间（见 healBatchTimes） */
  var TIME_MIN = 1000000000000;   // 13 位毫秒时间戳下限（2001-09-09）
  var TIME_MAX = 4102444800000;   // 上限（2100-01-01）

  // 各种时间写法统一成毫秒数（兼容秒级时间戳、数字字符串、日期字符串），认不出返回 0
  function timeToMs(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (typeof v === 'string') {
      var s = v.trim();
      if (!s) return 0;
      if (/^\d+$/.test(s)) {
        var n = parseInt(s, 10);
        return n < 100000000000 ? n * 1000 : n;
      }
      var t = Date.parse(s);
      return isNaN(t) ? 0 : t;
    }
    return 0;
  }

  // 记录 id 是毫秒时间戳时返回它（老数据的自增序号返回 0）
  function recordIdMs(r) {
    if (!r) return 0;
    var n = timeToMs(r.id);
    return (n > TIME_MIN && n < TIME_MAX) ? n : 0;
  }

  /* 统一时间字段：每条记录必须同时带 time（创建时间）和 updatedTime（最后修改时间）。
     · 新建记录时两者相同，之后只有真正编辑才更新 updatedTime
     · 兼容外部 JSON / 云端的各种命名：created_at、updated_at、createdTime、modifiedTime …
     · 导入时缺哪个就补哪个：缺 updatedTime 视为"没改过"，补成创建时间 */
  function normalizeRecord(r) {
    if (!r) return r;
    var rawCreated = r.time || r.createdTime || r.createdAt || r.created_at || 0;
    var rawUpdated = r.updatedTime || r.modifiedTime || r.updatedAt || r.updated_at || 0;
    var idMs = recordIdMs(r);
    var created = timeToMs(rawCreated) || idMs;
    var updated = timeToMs(rawUpdated) || created;
    if (idMs && created && Math.abs(created - idMs) > 60000) {
      /* 创建时间被同步改写过：以 id 为准；修改时间若跟着被刷，也一起回退 */
      if (Math.abs(updated - created) <= 60000) updated = idMs;
      created = idMs;
    }
    if (!created) created = Date.now();
    if (!updated) updated = created;
    r.time = created;
    r.updatedTime = updated;
    delete r.createdTime;
    delete r.createdAt;
    delete r.created_at;
    delete r.modifiedTime;
    delete r.updatedAt;
    delete r.updated_at;
    return r;
  }

  /* 同一分钟里"被修改"的一大堆记录，只可能是同步批量写时间造成的，
     逐条没法判断真假，所以按批处理：回退成各自的创建时间 */
  function healBatchTimes(list) {
    var groups = {}, i, r, u, idMs, key, d;
    for (i = 0; i < (list || []).length; i++) {
      r = list[i];
      u = timeToMs(r.updatedTime);
      idMs = recordIdMs(r);
      if (!u || !idMs || u - idMs < 60000) continue;
      d = new Date(u);
      key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate() + ' ' + d.getHours() + ':' + d.getMinutes();
      (groups[key] = groups[key] || []).push(r);
    }
    Object.keys(groups).forEach(function(k) {
      var g = groups[k];
      if (g.length < 2) return;
      g.forEach(function(rec) {
        rec.updatedTime = timeToMs(rec.time) || recordIdMs(rec) || rec.updatedTime;
      });
    });
    return list;
  }

  // 是否真的被修改过（统一换算成毫秒比较，1 秒以内视为没改过）
  function isModifiedRecord(r) {
    if (!r) return false;
    var u = timeToMs(r.updatedTime);
    if (!u) return false;
    var t = timeToMs(r.time) || recordIdMs(r);
    if (!t) return true;
    return Math.abs(u - t) > 1000;
  }

  // 取一条记录用于「显示」的图片：优先本地原图备份，其次云端地址
  function displayImages(r) {
    if (!r) return [];
    var imgs = (r.images && r.images.length) ? r.images : (r.image ? [r.image] : []);
    var backup = r.localImages || [];
    var out = [];
    for (var i = 0; i < imgs.length; i++) {
      out.push(backup[i] || imgs[i]);
    }
    return out;
  }

  // 两组图片是否完全一样（数量和每一张都相同才算没动过）
  function sameImageList(a, b) {
    a = a || [];
    b = b || [];
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) {
      if (a[i] !== b[i]) return false;
    }
    return true;
  }

  /* 维护两种图片字段：
     · record.images     —— 给云端和推送用的（已上传的保持 URL，新图保持 base64，避免重复上传）
     · record.localImages —— 本地原图备份，只存在浏览器里、不推送；与 images 等长，
                            没有原图的位置为 null。用于 URL 失效时仍能显示、导出时内嵌。 */
  function syncRecordImages(record, newImages) {
    var prevImages = record.images || [];
    var prevBackup = record.localImages || [];
    var prevLen = Math.max(prevImages.length, prevBackup.length);
    var prevLocal = [];
    for (var i = 0; i < prevLen; i++) {
      prevLocal.push(prevBackup[i] || prevImages[i] || '');
    }
    var cloud = [];
    var backup = [];
    for (var j = 0; j < newImages.length; j++) {
      var src = newImages[j];
      // 位置对齐、内容没变、云端已有 URL → 沿用 URL
      if (j < prevLocal.length && prevLocal[j] === src && j < prevImages.length && !isDataUrl(prevImages[j])) {
        cloud.push(prevImages[j]);
      } else {
        cloud.push(src);
      }
      backup.push(isDataUrl(src) ? src : null);
    }
    record.images = cloud;
    var hasBackup = false;
    for (var k = 0; k < backup.length; k++) { if (backup[k]) { hasBackup = true; break; } }
    if (hasBackup) { record.localImages = backup; } else { delete record.localImages; }
  }

  // 关闭弹窗
  function closeModal() {
    document.getElementById('recordModal').classList.remove('show');
    editingRecordId = null;
  }

  // 处理粘贴事件（截图图片/图片文件/普通文件/文字）
  function handlePaste(e) {
    var cd = e.clipboardData || (window.clipboardData);
    if (!cd) return;
    var imageFiles = [];
    var seenImage = false;

    // 1. 从 items 取（截图生成的图片在这里）
    var items = cd.items;
    if (items) {
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.kind === 'file' && it.type && it.type.indexOf('image/') === 0) {
          var f0 = it.getAsFile();
          if (f0) { imageFiles.push(f0); seenImage = true; }
        }
      }
    }

    // 2. 从 files 取（Ctrl+C 复制图片文件后粘贴走这里）—— 和 items 去重
    var files = cd.files;
    if (files && files.length && !seenImage) {
      for (var f = 0; f < files.length; f++) {
        var file = files[f];
        if (file.type && file.type.indexOf('image/') === 0) {
          imageFiles.push(file);
        }
      }
    }

    if (imageFiles.length) {
      e.preventDefault();
      for (var k = 0; k < imageFiles.length; k++) handleImage(imageFiles[k]);
      return;
    }
  }

  // 处理图片选择（追加到数组，不覆盖之前的）
  function handleImage(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      editingImages.push(e.target.result);
      renderImagePreview();
    };
    reader.readAsDataURL(file);
  }

  // 渲染图片预览网格（支持多张，每张可单独移除）
  function renderImagePreview() {
    var area = document.getElementById('imagePreviewArea');
    var grid = document.getElementById('imagePreviewGrid');
    if (!area || !grid) return;
    if (!editingImages.length) {
      area.style.display = 'none';
      grid.innerHTML = '';
      return;
    }
    area.style.display = 'block';
    var html = '';
    for (var i = 0; i < editingImages.length; i++) {
      html += '<div class="preview-item">';
      html += '<img src="' + editingImages[i] + '" alt="预览图' + (i + 1) + '">';
      html += '<button type="button" class="preview-remove" data-idx="' + i + '" title="移除这张">×</button>';
      html += '</div>';
    }
    grid.innerHTML = html;
    var btns = grid.querySelectorAll('.preview-remove');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function(ev) {
        ev.stopPropagation();
        var idx = parseInt(this.getAttribute('data-idx'));
        editingImages.splice(idx, 1);
        renderImagePreview();
      });
    }
  }

  // 保存记录
  function saveRecord() {
    var text = document.getElementById('recordText').value.trim();
    var title = document.getElementById('recordTitle').value.trim();
    if (!text && !editingImages.length && !title) {
      alert('请输入文字或添加图片~');
      return;
    }
    var now = Date.now();
    var savedRecord = null;
    try {
      if (editingRecordId) {
        // 编辑模式：更新已有记录
        var record = findRecord(editingRecordId);
        if (record) {
          var nextTitle = title || '';
          var nextText = text || '';
          /* 只有内容真的变了才算一次修改：标题、正文、图片（数量或具体哪几张）任一不同。
             点保存但什么都没改 → 不动 updatedTime、不推送云端，记录仍是创建时的样子。 */
          var didChange = (record.title || '') !== nextTitle ||
                          (record.text || '') !== nextText ||
                          !sameImageList(displayImages(record), editingImages);
          if (didChange) {
            record.title = nextTitle;
            record.text = nextText;
            syncRecordImages(record, editingImages);   // 图片：已上传的沿用 URL，新图存 base64
            record.updatedTime = now;
            savedRecord = record;
          }
          /* 没改动就静默收工：不更新时间、不写盘、不推送，也不用提示 */
        } else {
          // 记录不存在，降级为新增
          var addRec = {
            id: now,
            title: title || '',
            text: text || '',
            time: now,
            updatedTime: now
          };
          syncRecordImages(addRec, editingImages);
          records.push(addRec);
          savedRecord = addRec;
        }
        editingRecordId = null;
      } else {
        // 新增模式
        var newRec = {
          id: now,
          title: title || '',
          text: text || '',
          time: now,
          updatedTime: now
        };
        syncRecordImages(newRec, editingImages);
        records.push(newRec);
        savedRecord = newRec;
      }
      /* 内容没变化时 savedRecord 为 null：不写盘、不推送，避免无谓的「修改于」 */
      if (savedRecord) saveRecords([savedRecord]);
    } catch(e) {
      showSyncStatus('保存出错: ' + e.message, 'error');
    }
    render();
    closeModal();
  }

  // 删除记录
  function deleteRecord(id) {
    if (!confirm('确定删除这条记录吗？')) return;
    records = records.filter(function(r) { return r.id !== id; });
    /* 同步更新云端快照，否则后面导入时会误以为"云端还有这条"而不上传 */
    lastCloudRecords = lastCloudRecords.filter(function(x) { return String(x.id) !== String(id); });
    addPendingDelete(id);
    saveRecords();
    deleteRecordFromD1(id).then(function() {
      removePendingDelete(id);
      showSyncStatus('删除已同步 ✓', 'success');
      setTimeout(function() { showSyncStatus('', ''); }, 2000);
    }).catch(function(err) {
      showSyncStatus('删除未同步：' + (err.message || '网络错误') + '，联网后刷新会自动重试', 'error');
    });
    render();
  }

  // 图片灯箱
  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('imageLightbox').classList.add('show');
  }
  function closeLightbox() {
    document.getElementById('imageLightbox').classList.remove('show');
  }

  // ========== 事件绑定（附带空值保护）==========
  var _el;
  _el = document.getElementById('addRecordBtn');    if (_el) _el.addEventListener('click', openModal);
  _el = document.getElementById('cancelRecord');     if (_el) _el.addEventListener('click', closeModal);
  _el = document.getElementById('recordModal');      if (_el) _el.addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  _el = document.getElementById('imageInput');       if (_el) _el.addEventListener('change', function() { if (this.files) { for (var fi = 0; fi < this.files.length; fi++) handleImage(this.files[fi]); } });
  _el = document.getElementById('recordModal');      if (_el) _el.addEventListener('paste', handlePaste);
  // 保存按钮：带防重入锁
  _el = document.getElementById('saveRecordBtn');
  if (_el && !_el._saveBound) {
    _el._saveBound = true;
    _el.addEventListener('click', function() {
      if (this._saving) return;
      this._saving = true;
      saveRecord();
      var btn = this;
      setTimeout(function() { btn._saving = false; }, 800);
    });
  }

  // 搜索图标点击展开/关闭
  var searchPopup = document.getElementById('searchPopup');
  var searchIconBtn = document.getElementById('searchIconBtn');
  var searchInput = document.getElementById('searchBar');
  if (searchIconBtn) {
    searchIconBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var isOpen = searchPopup.classList.contains('open');
      if (isOpen) {
        searchPopup.classList.remove('open');
        searchIconBtn.classList.remove('active');
      } else {
        searchPopup.classList.add('open');
        searchIconBtn.classList.add('active');
        searchInput.focus();
      }
    });
  }
  // 点击外部关闭
  document.addEventListener('click', function(e) {
    if (searchPopup && searchIconBtn && searchPopup.classList.contains('open') &&
        !searchPopup.contains(e.target) &&
        !searchIconBtn.contains(e.target)) {
      searchPopup.classList.remove('open');
      searchIconBtn.classList.remove('active');
    }
  });
  // 输入时实时过滤
  if (searchInput) {
    searchInput.addEventListener('input', function() { render(); });
    // Enter 键搜索
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); render(); searchInput.blur(); }
    });
    // Esc 关闭
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        searchPopup.classList.remove('open');
        searchIconBtn.classList.remove('active');
        searchInput.value = '';
        render();
      }
    });
  }

  // 键盘快捷键 Ctrl+Enter 保存
  _el = document.getElementById('recordText');
  if (_el) _el.addEventListener('keydown', function(e) { if (e.ctrlKey && e.key === 'Enter') saveRecord(); });

  // 删除/编辑/点击跳转 事件委托
  _el = document.getElementById('recordsContainer');
  if (_el) _el.addEventListener('click', function(e) {
    if (e.target.classList.contains('record-delete')) {
      deleteRecord(parseInt(e.target.getAttribute('data-id')));
      return;
    }
    if (e.target.classList.contains('record-edit')) {
      openModal(parseInt(e.target.getAttribute('data-id')));
      return;
    }
    if (e.target.classList.contains('record-image')) {
      openLightbox(e.target.getAttribute('data-src'));
      return;
    }
    // 搜索模式下点击卡片内容 → 跳转到该记录
    var searchTerm = searchInput.value.trim();
    if (searchTerm) {
      var card = e.target.closest('.record-card');
      if (card) {
        var targetId = card.getAttribute('data-id');
        // 清空搜索、收起搜索框、重新渲染全部
        searchPopup.classList.remove('open');
        searchIconBtn.classList.remove('active');
        searchInput.value = '';
        render();
        // 滚动到目标记录
        var targetEl = document.getElementById('record-' + targetId);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          // 高亮闪烁
          targetEl.style.transition = 'box-shadow 0.15s ease';
          targetEl.style.boxShadow = '0 0 0 3px #ff6b81';
          setTimeout(function() {
            targetEl.style.boxShadow = '';
            setTimeout(function() { targetEl.style.transition = ''; }, 150);
          }, 600);
        }
      }
    }
  });

  // 灯箱关闭
  _el = document.getElementById('imageLightbox');
  if (_el) _el.addEventListener('click', closeLightbox);

  // 跨标签同步（其他标签页修改了 records 时重新加载）
  window.addEventListener('storage', function(e) {
    if (e.key === STORAGE_KEY) {
      loadRecords();
      render();
    }
    if (e.key === TOKEN_KEY) {
      updateSyncUI();
    }
  });

  // ========== 同步设置弹窗 ==========
  /* 弹窗内的提示行 */
  function syncFeedbackMsg(type, msg) {
    var fb = document.getElementById('syncFeedback');
    if (!fb) return;
    fb.className = 'sync-feedback ' + type;
    fb.textContent = msg;
    fb.style.display = 'block';
  }
  /* 只有操作成功时才自动关窗；失败留在原地让用户看清原因 */
  function closeSyncModalSoon(delay) {
    setTimeout(function() {
      var modal = document.getElementById('syncModal');
      if (modal) modal.classList.remove('show');
      var fb = document.getElementById('syncFeedback');
      if (fb) { fb.style.display = 'none'; fb.textContent = ''; }
    }, delay || 900);
  }
  _el = document.getElementById('syncSettingsBtn');
  if (_el) _el.addEventListener('click', function() {
    document.getElementById('githubToken').value = getToken();
    document.getElementById('syncFeedback').style.display = 'none';
    document.getElementById('syncModal').classList.add('show');
  });
  _el = document.getElementById('cancelSync');
  if (_el) _el.addEventListener('click', function() {
    document.getElementById('syncModal').classList.remove('show');
  });
  _el = document.getElementById('syncModal');
  if (_el) _el.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });
  _el = document.getElementById('saveSync');
  if (_el) _el.addEventListener('click', function() {
    var token = document.getElementById('githubToken').value.trim();
    if (!token) { syncFeedbackMsg('error', '请输入同步密钥'); return; }
    setToken(token);
    updateSyncUI();
    // 测试连接并加载云端数据
    showSyncStatus('测试连接中…', 'syncing');
    loadFromD1().then(function(d1Records) {
      if (d1Records === null) {
        /* 连接失败：只提示，弹窗留着，方便改密钥直接重试 */
        syncFeedbackMsg('error', '连接失败，请检查密钥后重试');
        return;
      }
      var localBefore = records.slice();
      var filteredCloud = d1Records.filter(function(r) { return !isPendingDelete(r.id); });
      mergeRecords(filteredCloud);
      saveRecordsToLocal();
      render();
      return pushLocalChanges(localBefore, d1Records).then(function(res) {
        if (res.failed > 0) {
          /* 还有记录没推上去：算失败，不关闭 */
          syncFeedbackMsg('error', '连接成功，但有 ' + res.failed + ' 条本地记录未同步：' + res.lastError + '，请稍后重试');
          return;
        }
        syncFeedbackMsg('success', '连接成功！已同步 ' + records.length + ' 条记录，补推 ' + res.pushed + ' 条');
        closeSyncModalSoon(1000);   // 全部成功才自动关闭
      });
    }).catch(function(err) {
      syncFeedbackMsg('error', '连接失败：' + (err.message || err));
      setToken('');
      updateSyncUI();
    });
  });

  // 导出按钮
  _el = document.getElementById('exportRecordsBtn');
  if (_el) _el.addEventListener('click', exportRecords);

  // 导入按钮：点击导出按钮后弹出文件选择器
  _el = document.getElementById('importRecordsBtn');
  if (_el) _el.addEventListener('click', function() {
    var input = document.getElementById('importRecordsInput');
    input.value = '';
    input.click();
  });
  _el = document.getElementById('importRecordsInput');
  if (_el) _el.addEventListener('change', function() {
    if (this.files && this.files[0]) importRecords(this.files[0]);
  });

  // 只写本地存储不触发同步（用于初始化合并）
  function saveRecordsToLocal() {
    saveToStorage().catch(function() {});
  }

  // 判断两条记录内容是否一致（图片只比数量：本地是 base64、云端是 URL，不该因为格式被判成"改过"）
  function sameRecordContent(a, b) {
    if (!a || !b) return false;
    if ((a.title || '') !== (b.title || '')) return false;
    if ((a.text || '') !== (b.text || '')) return false;
    var ai = (a.images && a.images.length) ? a.images : (a.image ? [a.image] : []);
    var bi = (b.images && b.images.length) ? b.images : (b.image ? [b.image] : []);
    return ai.length === bi.length;
  }

  /* 合并云端和本地记录（按 id 去重）：
     · 内容完全一致 → 一律保留本地那份的创建/修改时间，绝不让云端时间覆盖
       （云端会把 updated_at 写成同步那一刻，一覆盖就变成「修改于今天」）
     · 内容不同 → 才按时间取较新的版本 */
  function mergeRecords(ghRecords) {
    if (!ghRecords || !ghRecords.length) return;
    var map = {};
    var all = records.concat(ghRecords);
    for (var i = 0; i < all.length; i++) {
      var r = all[i];
      var exist = map[r.id];
      if (!exist) {
        map[r.id] = r;
        continue;
      }
      if (sameRecordContent(exist, r)) {
        /* 同一份内容：本地时间说了算，只把云端多出来的原图备份补进来 */
        if ((!exist.localImages || !exist.localImages.length) && r.localImages && r.localImages.length) {
          exist.localImages = r.localImages;
        }
        map[r.id] = exist;
        continue;
      }
      var ver = timeToMs(r.updatedTime) || timeToMs(r.time) || 0;
      var existVer = timeToMs(exist.updatedTime) || timeToMs(exist.time) || 0;
      if (ver > existVer) {
        // 云端版本胜出时，把本地保存的原图备份带过来（云端只存 URL，本地才有原图）
        var winner = r;
        if (exist.localImages && exist.localImages.length) {
          winner = Object.assign({}, r, { localImages: exist.localImages });
        }
        map[r.id] = winner;
      }
    }
    records = Object.values(map).sort(function(a, b) { return a.id - b.id; });
    healBatchTimes(records);

    /* 收尾：本地记录里若是 base64 图片、而云端同一位置已有 URL，
       就把 images 换成 URL，原图存进 localImages 备份。
       这样后续补推发出去的是 URL，云端不会把同一张图重复上传进 R2。 */
    var cloudById = {};
    for (var c = 0; c < ghRecords.length; c++) { cloudById[ghRecords[c].id] = ghRecords[c]; }
    records.forEach(function(rec) {
      var cloud = cloudById[rec.id];
      if (!cloud || !cloud.images || !cloud.images.length) return;
      if (!rec.images || rec.images.length !== cloud.images.length) return;
      var backup = (rec.localImages && rec.localImages.length) ? rec.localImages.slice() : [];
      var changed = false;
      var next = [];
      for (var i = 0; i < rec.images.length; i++) {
        var s = rec.images[i];
        if (isDataUrl(s) && !isDataUrl(cloud.images[i])) {
          backup[i] = s;
          next.push(cloud.images[i]);
          changed = true;
        } else {
          next.push(s);
        }
      }
      if (changed) {
        rec.images = next;
        rec.localImages = backup;
      }
    });
  }

  // ========== 导入导出 ==========
  // 把一张远程图片转成 base64（导出时内嵌用；跨域被拒/404 时抛错，由调用处降级）
  function imageToDataUrl(url) {
    return fetch(url, { credentials: 'omit' }).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.blob();
    }).then(function(blob) {
      return new Promise(function(resolve, reject) {
        var fr = new FileReader();
        fr.onload = function() { resolve(fr.result); };
        fr.onerror = function() { reject(new Error('读取失败')); };
        fr.readAsDataURL(blob);
      });
    });
  }

  function downloadJsonFile(data, filename) {
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  }

  /* 导出本地所有记录为 JSON 文件：
     图片能内嵌成 base64 的一律内嵌（导出文件自包含，云端删了也能完整恢复）；
     跨域或 404 取不到的保留原链接，并在提示里说明有几张没内嵌。 */
  function exportRecords() {
    showSyncStatus('正在打包图片…', 'syncing');
    var failed = 0;
    var jobs = records.map(function(r) {
      var imgs = displayImages(r);
      var tasks = imgs.map(function(src) {
        if (isDataUrl(src)) return Promise.resolve(src);
        return imageToDataUrl(src).catch(function() { failed++; return src; });
      });
      return Promise.all(tasks).then(function(list) {
        var copy = {};
        for (var k in r) {
          if (Object.prototype.hasOwnProperty.call(r, k)) copy[k] = r[k];
        }
        copy.images = list;
        delete copy.localImages;   // 图片已经在 images 里，备份字段不用导出
        return normalizeRecord(copy);   // 导出必须同时带创建时间和修改时间
      });
    });
    Promise.all(jobs).then(function(list) {
      var ts = new Date().toISOString().slice(0, 10);
      downloadJsonFile(JSON.stringify(list, null, 2), 'records-' + ts + '.json');
      if (failed) {
        syncFeedbackMsg('success', '已导出 ' + list.length + ' 条，其中 ' + failed + ' 张图片取不到、保留了原链接');
        showSyncStatus('已导出 ' + list.length + ' 条，其中 ' + failed + ' 张图片取不到、保留了链接', 'error');
      } else {
        syncFeedbackMsg('success', '已导出 ' + list.length + ' 条，图片已全部内嵌');
        showSyncStatus('已导出 ' + list.length + ' 条，图片已全部内嵌', 'success');
      }
      closeSyncModalSoon(900);   // 文件已下载，导出完成就关窗
      setTimeout(function() { showSyncStatus('', ''); }, 4000);
    }).catch(function(e) {
      syncFeedbackMsg('error', '导出失败：' + (e.message || e));
      showSyncStatus('导出失败: ' + (e.message || e), 'error');
    });
  }

  // 导入 JSON 文件，与现有记录按 id 去重合并，按时间排序后同步到云端
  function importRecords(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var imported = JSON.parse(e.target.result);
        if (!Array.isArray(imported)) {
          syncFeedbackMsg('error', '导入失败：文件格式错误，应为记录数组');
          return;
        }
        // 过滤无效记录
        var valid = imported.filter(function(r) { return r && r.id; });
        if (!valid.length) {
          syncFeedbackMsg('error', '导入失败：文件中没有有效记录');
          return;
        }
        // 统一时间字段：缺 updatedTime 的视为"没改过"，补成创建时间（导入后按修改时间优先展示）
        valid.forEach(normalizeRecord);
        // 导入文件里的 base64 图片同时记为本地原图备份，之后即使云端图片被删也能显示
        valid.forEach(function(r) {
          var imgs = (r.images && r.images.length) ? r.images : (r.image ? [r.image] : []);
          if (!imgs.length) return;
          var backup = imgs.map(function(s) { return isDataUrl(s) ? s : null; });
          for (var bi = 0; bi < backup.length; bi++) {
            if (backup[bi]) { r.localImages = backup; break; }
          }
        });
        // 合并前记录数量
        var beforeCount = records.length;
        /* 先重新拉一次云端快照再判断要不要上传：
           内存里的 lastCloudRecords 可能已过期（比如刚才在页面上删过记录），
           用它判断"云端已有"会漏推，导致导入后要刷新页面才补同步。 */
        Promise.resolve(loadFromD1()).then(function(cloudList) {
          if (cloudList) { lastCloudRecords = cloudList.slice(); }
          mergeRecords(valid);
          /* 只上传「云端没有的」和「内容确实不同的」记录：
             以前这里把所有导入记录统统 POST 一遍，云端会把 updated_at 刷成当前时间，
             导致很早的记录显示成「修改于今天」。内容一样的就不要再发。 */
          var cloudMap = {};
          lastCloudRecords.forEach(function(r) { cloudMap[r.id] = r; });
          var toPush = [];
          records.forEach(function(r) {
            var cloud = cloudMap[r.id];
            if (!cloud) { toPush.push(r); return; }
            if (!sameRecordContent(r, cloud)) { toPush.push(r); }
          });
          saveRecordsToLocal();
          toPush.forEach(function(r) { pushRecordToD1(r); });
          render();
          var added = records.length - beforeCount;
          var msg = '导入成功！新增 ' + added + ' 条，共 ' + records.length + ' 条记录';
          if (toPush.length) {
            msg += '，正在同步 ' + toPush.length + ' 条到云端…';
          } else {
            msg += '，云端已有相同内容，未重复上传';
          }
          syncFeedbackMsg('success', msg);
          showSyncStatus(msg, 'success');   // 关窗后左下角仍能看到结果
          setTimeout(function() { showSyncStatus('', ''); }, 5000);
          closeSyncModalSoon(1200);   // 导入成功才关窗
        }).catch(function(err) {
          syncFeedbackMsg('error', '导入失败：' + (err.message || err));
        });
      } catch(err) {
        syncFeedbackMsg('error', '导入失败：文件解析失败，' + err.message);
      }
    };
    reader.onerror = function() {
      syncFeedbackMsg('error', '导入失败：文件读取失败');
    };
    reader.readAsText(file);
  }

  // 初始化：先本地加载，再从云端拉取合并，然后把本地独有/更新的记录补推回云端
  function init() {
    updateSyncUI();
    loadRecords(); // 异步加载（IndexedDB）
    render();

    if (hasToken()) {
      loadFromD1().then(function(d1Records) {
        if (d1Records === null) return;
        lastCloudRecords = d1Records.slice();
        var localBefore = records.slice();
        var pending = getPendingDeletes();
        var filteredCloud = d1Records.filter(function(r) { return !isPendingDelete(r.id); });
        mergeRecords(filteredCloud);
        saveRecordsToLocal();
        render();
        return pushLocalChanges(localBefore, d1Records).then(function(res) {
          if (res.failed > 0) {
            showSyncStatus('本地有 ' + res.failed + ' 条未同步：' + res.lastError + '，联网后刷新会自动重试', 'error');
          } else if (res.pushed > 0 || res.deletedRetried > 0) {
            showSyncStatus('补同步完成：上传 ' + res.pushed + ' 条，删除重试 ' + res.deletedRetried + ' 条 ✓', 'success');
            setTimeout(function() { showSyncStatus('', ''); }, 3000);
          } else {
            showSyncStatus('已同步 ✓', 'success');
            setTimeout(function() { showSyncStatus('', ''); }, 2000);
          }
        });
      });
    }
  }

  // 暴露给内联 onclick 调用
  window._saveRecord = saveRecord;
  window.saveRecord = saveRecord;
  window.readClipboard = function() {};
  window.openAddRecordModal = function() { openModal(); };
  window.openSyncModalFn = function() {
    document.getElementById('githubToken').value = getToken();
    document.getElementById('syncFeedback').style.display = 'none';
    document.getElementById('syncModal').classList.add('show');
  };

  init();
</script>
