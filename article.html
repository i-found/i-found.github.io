    <!-- 鼠标点击产生爱心 -->
    <script type="text/javascript">
    (function(window,document,undefined){
        var hearts = [];

        window.requestAnimationFrame = (function(){
            return window.requestAnimationFrame ||
            window.webkitRequestAnimationFrame ||
            window.mozRequestAnimationFrame ||
             window.oRequestAnimationFrame ||
             window.msRequestAnimationFrame ||
             function (callback){
                 setTimeout(callback,1000/60);
             }
        })();

        init();

        function init(){
            css(".heart{width: 10px;height: 10px;position: fixed;background: #f00;transform: rotate(45deg);-webkit-transform: rotate(45deg);-moz-transform: rotate(45deg);}.heart:after,.heart:before{content: '';width: inherit;height: inherit;background: inherit;border-radius: 50%;-webkit-border-radius: 50%;-moz-border-radius: 50%;position: absolute;}.heart:after{top: -5px;}.heart:before{left: -5px;}");
            attachEvent();
            gameloop();
        }

        function gameloop(){
            for(var i=0;i<hearts.length;i++){
                if(hearts[i].alpha <=0){
                    document.body.removeChild(hearts[i].el);
                    hearts.splice(i,1);
                    continue;
                 }

                 hearts[i].y--;
                 hearts[i].scale += 0.004;
                 hearts[i].alpha -= 0.013;
                 hearts[i].el.style.cssText = "left:"+hearts[i].x+"px;top:"+hearts[i].y+"px;opacity:"+hearts[i].alpha+";transform:scale("+hearts[i].scale+","+hearts[i].scale+") rotate(45deg);background:"+hearts[i].color;
            }

            requestAnimationFrame(gameloop);
        }

        function attachEvent(){
            var old = typeof window.onclick==="function" && window.onclick;
            window.onclick = function(event){
                old && old();
                createHeart(event);
            }
        }

        function createHeart(event){
            var d = document.createElement("div");
            d.className = "heart";
            hearts.push({
                el : d,
                x : event.clientX - 5,
                y : event.clientY - 5,
                scale : 1,
                alpha : 1,
                color : randomColor()
            });

            document.body.appendChild(d);
        }

        function css(css){
            var style = document.createElement("style");
            style.type="text/css";
            try{
                style.appendChild(document.createTextNode(css));
            }
            catch(ex){
                style.styleSheet.cssText = css;
            }

            document.getElementsByTagName('head')[0].appendChild(style);
        }

        function randomColor(){
            return "rgb("+(~~(Math.random()*255))+","+(~~(Math.random()*255))+","+(~~(Math.random()*255))+")";
        }

    })(window,document);

    </script>

    <script type="text/javascript">
    var days=new  Array ("日", "一", "二", "三", "四", "五", "六");
    function showDT() {
      var currentDT = new Date();
      var y,m,date,day,hs,ms,ss,theDateStr;
      y = currentDT.getFullYear(); //四位整数表示的年份
      m = (currentDT.getMonth()+1); //月
      date = currentDT.getDate(); //日
      day = currentDT.getDay(); //星期
      hs = currentDT.getHours(); //时
      ms = currentDT.getMinutes(); //分
      ss = currentDT.getSeconds(); //秒
      theDateStr = y+"年"+m+"月"+date+"日 星期"+days[day]+" "+hs+":"+ms+":"+ss;
      theYearStr = y;
      theDayStr = date;
      document.getElementById("theYear"). innerHTML =theYearStr;
      document.getElementById("theDate"). innerHTML =theDayStr;
      document.getElementById("theClock"). innerHTML =theDateStr;
      // setTimeout 在执行时,是在载入后延迟指定时间后,去执行一次表达式,仅执行一次
      window.setTimeout( showDT, 1000);
    }
    </script>

    <div class="modal-time" id="modalTime"></div>
    <input type="text" class="modal-title-input" id="recordTitle" placeholder="输入笔记标题">
    <textarea id="recordText" placeholder="写下你想记录的..."></textarea>
    <div class="image-preview-area" id="imagePreviewArea" style="display:none;">
      <div class="image-preview-grid" id="imagePreviewGrid"></div>
    </div>
    <div class="modal-toolbar">
      <label class="img-upload-label">
        📷 添加图片
        <input type="file" id="imageInput" accept="image/*" multiple>
      </label>
    </div>
    <div class="modal-buttons">
      <button class="btn-cancel" id="cancelRecord">取消</button>
      <button class="btn-save" id="saveRecordBtn" type="button">保存</button>
    </div>
  </div>
</div>

<!-- ========== 同步设置弹窗 ========== -->
<div class="modal-overlay" id="syncModal">
  <div class="modal-content sync-modal-content">
    <h3>GitHub 同步设置</h3>
    <p class="sync-desc">配置 Token 后，记录将自动同步到仓库的 <code>data/records.json</code> 文件。</p>
    <label class="token-label" for="githubToken">GitHub Personal Access Token</label>
    <input type="password" class="token-input" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">
    <p class="token-hint">
      <a href="https://github.com/settings/tokens/new?scopes=repo&description=RecordsSync" target="_blank">点此创建 Token</a>，只需勾选 <strong>repo</strong> 权限即可。
    </p>
    <div class="modal-buttons">
      <button class="btn-cancel" id="cancelSync">取消</button>
      <button class="btn-save" id="saveSync">保存</button>
      <button class="btn-cancel" id="exportRecordsBtn">导出</button>
      <button class="btn-cancel" id="importRecordsBtn">导入</button>
      <input type="file" id="importRecordsInput" accept="application/json" style="display:none;">
    </div>
    <div class="sync-feedback" id="syncFeedback" style="display:none;"></div>
  </div>
</div>

<!-- ========== 图片灯箱 ========== -->
<div class="image-lightbox" id="imageLightbox">
  <img id="lightboxImg" src="" alt="查看大图">
</div>

<script>
// ========== 记录功能 JS ==========
  var STORAGE_KEY = 'suihe_records';
  var TOKEN_KEY = 'suihe_github_token';
  var GITHUB_OWNER = 'i-found';
  var GITHUB_REPO = 'i-found.github.io';
  var GITHUB_PATH = 'data/records.json';
  var records = [];
  var editingImages = []; // 编辑模式下的图片数组（支持多张）
  var editingRecordId = null; // 编辑模式下的记录 ID
  var githubSha = null; // records.json 的 sha，更新时需要

  // ========== IndexedDB 存储（解决 5MB localStorage 限制）==========
  var DB_NAME = 'suihe_records_db';
  var DB_VERSION = 1;
  var DB_STORE = 'records';
  var dbInstance = null;

  function openDB() {
    if (dbInstance) return Promise.resolve(dbInstance);
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains(DB_STORE)) {
          db.createObjectStore(DB_STORE);
        }
      };
      req.onsuccess = function(e) { dbInstance = e.target.result; resolve(dbInstance); };
      req.onerror = function(e) { reject(e.target.error); };
    });
  }

  function idbGet(key) {
    return openDB().then(function(db) {
      return new Promise(function(resolve, reject) {
        var tx = db.transaction(DB_STORE, 'readonly');
        var req = tx.objectStore(DB_STORE).get(key);
        req.onsuccess = function() { resolve(req.result); };
        req.onerror = function() { reject(req.error); };
      });
    });
  }

  function idbSet(key, value) {
    return openDB().then(function(db) {
      return new Promise(function(resolve, reject) {
        var tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(value, key);
        tx.oncomplete = function() { resolve(); };
        tx.onerror = function() { reject(tx.error); };
      });
    });
  }

  // 保存到存储：优先 IndexedDB，失败时回退 localStorage（仅小数据）
  function saveToStorage() {
    var data = JSON.stringify(records);
    return idbSet(STORAGE_KEY, records).catch(function(e) {
      // 回退到 localStorage（但仅当数据较小时）
      try {
        if (data.length < 2 * 1024 * 1024) {
          localStorage.setItem(STORAGE_KEY, data);
        } else {
          throw e;
        }
      } catch(e2) {
        throw e2;
      }
    });
  }

  // ========== Token 管理 ==========
  function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
  function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
  function hasToken() { return !!getToken(); }

  function updateSyncUI() {
    var btn = document.getElementById('syncSettingsBtn');
    if (hasToken()) {
      btn.classList.add('configured');
      btn.title = '已配置同步';
    } else {
      btn.classList.remove('configured');
      btn.title = '同步设置';
    }
  }

  // 显示同步状态
  function showSyncStatus(msg, type) {
    var el = document.getElementById('syncStatus');
    el.textContent = msg;
    el.style.display = 'block';
    el.className = 'sync-status ' + (type || '');
  }

  // ========== GitHub API ==========
  function githubAPI(method, body) {
    var token = getToken();
    var headers = {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github.v3+json'
    };
    var opts = { method: method, headers: headers };
    if (body) {
      opts.body = JSON.stringify(body);
      headers['Content-Type'] = 'application/json';
    }
    var url = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_PATH;
    return fetch(url, opts).then(function(res) {
      if (res.status === 404) {
        var err = new Error('Not Found');
        err.status = 404;
        throw err;
      }
      if (!res.ok) {
        return res.json().then(function(j) {
          throw new Error(j.message || 'HTTP ' + res.status);
        });
      }
      return res.json();
    });
  }

  // 从 GitHub 拉取记录
  function loadFromGitHub() {
    if (!hasToken()) return Promise.resolve(null);
    showSyncStatus('同步中…', 'syncing');
    return githubAPI('GET').then(function(data) {
      githubSha = data.sha;
      var raw = data.content || '';
      // 大文件（>1MB）API 不返回 content，改用 download_url 直接拉取
      if (!raw && data.download_url && data.size > 0) {
        showSyncStatus('下载大文件中…', 'syncing');
        return fetch(data.download_url).then(function(r) { return r.text(); }).then(function(text) {
          var content = JSON.parse(text);
          if (!Array.isArray(content)) throw new Error('格式异常');
          showSyncStatus('已同步 ✓', 'success');
          setTimeout(function() { showSyncStatus('', ''); }, 2000);
          return content;
        }).catch(function(e) {
          showSyncStatus('下载失败: ' + e.message, 'error');
          return null;
        });
      }
      if (!raw) {
        showSyncStatus('云端为空', '');
        setTimeout(function() { showSyncStatus('', ''); }, 2000);
        return [];
      }
      // 解码 base64 → UTF-8 字符串
      var decoded;
      try {
        var bytes = Uint8Array.from(atob(raw), function(c) { return c.charCodeAt(0); });
        decoded = new TextDecoder('utf-8').decode(bytes);
      } catch(e) {
        try {
          decoded = decodeURIComponent(escape(atob(raw)));
        } catch(e2) {
          decoded = atob(raw);
        }
      }
      var content;
      try {
        content = JSON.parse(decoded);
      } catch(e) {
        showSyncStatus('云端数据已损坏', 'error');
        return null;
      }
      if (!Array.isArray(content)) {
        showSyncStatus('云端数据格式异常', 'error');
        return null;
      }
      showSyncStatus('已同步 ✓', 'success');
      setTimeout(function() { showSyncStatus('', ''); }, 2000);
      return content;
    }).catch(function(err) {
      if (err.message.indexOf('404') !== -1 || err.message.indexOf('Not Found') !== -1) {
        githubSha = null;
        showSyncStatus('云端无数据', '');
        setTimeout(function() { showSyncStatus('', ''); }, 2000);
        return null;
      }
      showSyncStatus('同步失败: ' + err.message, 'error');
      return null;
    });
  }

  // 推送记录到 GitHub（自动处理 SHA 冲突）
  function pushToGitHub() {
    if (!hasToken()) return Promise.resolve();
    // 用紧凑格式（无缩进）减少 base64 图片的体积膨胀
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(records))));
    var body = {
      message: '更新记录 [' + new Date().toISOString().slice(0, 19).replace('T', ' ') + ']',
      content: content,
      branch: 'main'
    };
    if (githubSha) body.sha = githubSha;
    showSyncStatus('同步中…', 'syncing');
    return githubAPI('PUT', body).then(function(data) {
      githubSha = data.content.sha;
      showSyncStatus('已同步 ✓', 'success');
      setTimeout(function() { showSyncStatus('', ''); }, 2000);
    }).catch(function(err) {
      var msg = err.message || '';
      // SHA 冲突（409 或 mismatch）：先拉取最新 SHA 再重试一次
      if (msg.indexOf('409') !== -1 || msg.indexOf('expected') !== -1 || msg.indexOf('but is at') !== -1) {
        showSyncStatus('检测到冲突，正在合并…', 'syncing');
        return githubAPI('GET').then(function(data) {
          githubSha = data.sha;
          body.sha = githubSha;
          return githubAPI('PUT', body).then(function(data2) {
            githubSha = data2.content.sha;
            showSyncStatus('已同步 ✓', 'success');
            setTimeout(function() { showSyncStatus('', ''); }, 2000);
          });
        }).catch(function(err2) {
          showSyncStatus('同步失败: ' + (err2.message || ''), 'error');
        });
      }
      if (msg.indexOf('401') !== -1 || msg.indexOf('Bad credentials') !== -1) {
        setToken('');
        updateSyncUI();
        showSyncStatus('Token 已失效，请重新设置（本地数据不受影响）', 'error');
        return;
      }
      showSyncStatus('同步失败: ' + msg, 'error');
      setTimeout(function() {
        var el = document.getElementById('syncStatus');
        if (el && el.textContent.indexOf('已失效') === -1) { showSyncStatus('', ''); }
      }, 5000);
    });
  }

  // ========== 记录管理 ==========

  // 加载记录（IndexedDB 优先，localStorage 兜底）
  function loadRecords() {
    // 尝试 IndexedDB
    if (window.indexedDB) {
      idbGet(STORAGE_KEY).then(function(data) {
        if (Array.isArray(data)) {
          records = data;
          render();
        }
      }).catch(function() {
        // 失败回退 localStorage
        tryLoadFromLocalStorage();
      });
    } else {
      tryLoadFromLocalStorage();
    }
    // 同步尝试 localStorage（首次迁移）
    tryLoadFromLocalStorage();
  }

  function tryLoadFromLocalStorage() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length && records.length === 0) {
          records = parsed;
          render();
          // 迁移到 IndexedDB
          saveToStorage().catch(function() {});
        }
      }
    } catch(e) {
      // 旧数据坏了，清掉
      try { localStorage.removeItem(STORAGE_KEY); } catch(e2) {}
    }
  }

  // 保存到本地存储 + 触发 GitHub 同步（异步）
  function saveRecords() {
    saveToStorage().then(function() {
      showSyncStatus('已保存 ' + records.length + ' 条记录', 'success');
      var s = document.getElementById('syncStatus');
      if (s) { s.style.color = '#4CAF50'; s.style.fontSize = '13px'; s.style.display = 'block'; }
    }).catch(function(e) {
      showSyncStatus('本地存储失败: ' + e.message, 'error');
    });
    pushToGitHub();
  }

  // 格式化时间（兼容多种格式：数字时间戳 / ISO字符串 / 已格式化的中文串）
  function formatTime(ts) {
    if (!ts) return '';
    // 如果已经是 "2026年7月31日 19:11" 这种格式，直接返回
    if (typeof ts === 'string' && ts.indexOf('年') !== -1) {
      return ts;
    }
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    var pad = function(n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // 渲染所有记录
  function render() {
    var container = document.getElementById('recordsContainer');
    var searchBar = document.getElementById('searchBar');
    var searchTerm = searchBar ? searchBar.value.trim().toLowerCase() : '';
    var filtered = records;

    if (searchTerm) {
      filtered = records.filter(function(r) {
        var inTitle = r.title && r.title.toLowerCase().indexOf(searchTerm) !== -1;
        var inText = r.text && r.text.toLowerCase().indexOf(searchTerm) !== -1;
        var inOcr = r.ocrText && r.ocrText.toLowerCase().indexOf(searchTerm) !== -1;
        return inTitle || inText || inOcr;
      });
    }

    if (filtered.length === 0) {
      container.innerHTML = '<div class="records-empty">' + (searchTerm ? '没有匹配的记录' : '还没有记录，点击上方按钮添加第一条吧~') + '</div>';
      return;
    }

    var html = '';
    for (var i = filtered.length - 1; i >= 0; i--) {
      var r = filtered[i];
      html += '<div class="record-card" data-id="' + r.id + '" id="record-' + r.id + '">';
      html += '<button class="record-edit" data-id="' + r.id + '" title="编辑">✎</button>';
      html += '<button class="record-delete" data-id="' + r.id + '" title="删除">×</button>';
      if (r.title) {
        html += '<div class="record-title">' + highlightText(r.title, searchTerm) + '</div>';
      }
      html += '<div class="record-text">' + highlightText(r.text, searchTerm) + '</div>';
      var imgs = (r.images && r.images.length) ? r.images : (r.image ? [r.image] : []);
      if (imgs.length) {
        html += '<div class="record-images">';
        for (var ii = 0; ii < imgs.length; ii++) {
          html += '<img class="record-image" src="' + imgs[ii] + '" alt="记录图片" data-src="' + imgs[ii] + '">';
        }
        html += '</div>';
      }
      html += '<span class="record-time">' + (r.updatedTime ? '修改于 ' + formatTime(r.updatedTime) : formatTime(r.time)) + '</span>';
      html += '<div style="clear:both;"></div>';
      html += '</div>';
    }
    container.innerHTML = html;
  }

  // 搜索关键词高亮
  function highlightText(text, keyword) {
    if (!keyword) return escapeHtml(text);
    var esc = escapeHtml(text);
    return esc.replace(new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark class="search-hl">$1</mark>');
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  // 打开弹窗
  function openModal(recordId) {
    // 关闭搜索弹窗并清空搜索词，避免保存后记录被过滤
    var searchPopup = document.getElementById('searchPopup');
    var searchIconBtn = document.getElementById('searchIconBtn');
    var searchInput = document.getElementById('searchBar');
    if (searchPopup) searchPopup.classList.remove('open');
    if (searchIconBtn) searchIconBtn.classList.remove('active');
    if (searchInput) searchInput.value = '';

    editingRecordId = recordId || null;
    var now = Date.now();
    if (editingRecordId) {
      // 编辑模式：填充已有数据
      var record = findRecord(editingRecordId);
      if (record) {
        document.getElementById('recordTitle').value = record.title || '';
        document.getElementById('recordText').value = record.text || '';
        document.getElementById('modalTime').textContent = '修改于 ' + formatTime(now);
        if (record.images && record.images.length) {
          editingImages = record.images.slice();
          renderImagePreview();
        } else if (record.image) {
          // 兼容旧单图数据
          editingImages = [record.image];
          renderImagePreview();
        } else {
          editingImages = [];
          document.getElementById('imagePreviewArea').style.display = 'none';
          document.getElementById('imagePreviewGrid').innerHTML = '';
        }
      }
    } else {
      // 新增模式
      document.getElementById('recordText').value = '';
      document.getElementById('recordTitle').value = '';
      document.getElementById('modalTime').textContent = formatTime(now);
      editingImages = [];
      document.getElementById('imagePreviewArea').style.display = 'none';
      document.getElementById('imagePreviewGrid').innerHTML = '';
    }
    document.getElementById('recordModal').classList.add('show');
    document.getElementById('recordTitle').focus();
  }

  // 查找记录
  function findRecord(id) {
    for (var i = 0; i < records.length; i++) {
      if (records[i].id === id) return records[i];
    }
    return null;
  }

  // 关闭弹窗
  function closeModal() {
    document.getElementById('recordModal').classList.remove('show');
    editingRecordId = null;
  }

  // 处理粘贴事件（截图图片/图片文件/普通文件/文字）
  function handlePaste(e) {
    var cd = e.clipboardData || (window.clipboardData);
    if (!cd) return;
    var imageFiles = [];
    var seenImage = false;

    // 1. 从 items 取（截图生成的图片在这里）
    var items = cd.items;
    if (items) {
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.kind === 'file' && it.type && it.type.indexOf('image/') === 0) {
          var f0 = it.getAsFile();
          if (f0) { imageFiles.push(f0); seenImage = true; }
        }
      }
    }

    // 2. 从 files 取（Ctrl+C 复制图片文件后粘贴走这里）—— 和 items 去重
    var files = cd.files;
    if (files && files.length && !seenImage) {
      for (var f = 0; f < files.length; f++) {
        var file = files[f];
        if (file.type && file.type.indexOf('image/') === 0) {
          imageFiles.push(file);
        }
      }
    }

    if (imageFiles.length) {
      e.preventDefault();
      for (var k = 0; k < imageFiles.length; k++) handleImage(imageFiles[k]);
      return;
    }
  }

  // 处理图片选择（追加到数组，不覆盖之前的）
  function handleImage(file) {
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      alert('图片不要超过 2MB 哦~');
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e) {
      editingImages.push(e.target.result);
      renderImagePreview();
    };
    reader.readAsDataURL(file);
  }

  // 渲染图片预览网格（支持多张，每张可单独移除）
  function renderImagePreview() {
    var area = document.getElementById('imagePreviewArea');
    var grid = document.getElementById('imagePreviewGrid');
    if (!area || !grid) return;
    if (!editingImages.length) {
      area.style.display = 'none';
      grid.innerHTML = '';
      return;
    }
    area.style.display = 'block';
    var html = '';
    for (var i = 0; i < editingImages.length; i++) {
      html += '<div class="preview-item">';
      html += '<img src="' + editingImages[i] + '" alt="预览图' + (i + 1) + '">';
      html += '<button type="button" class="preview-remove" data-idx="' + i + '" title="移除这张">×</button>';
      html += '</div>';
    }
    grid.innerHTML = html;
    var btns = grid.querySelectorAll('.preview-remove');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function(ev) {
        ev.stopPropagation();
        var idx = parseInt(this.getAttribute('data-idx'));
        editingImages.splice(idx, 1);
        renderImagePreview();
      });
    }
  }

  // 保存记录
  function saveRecord() {
    var text = document.getElementById('recordText').value.trim();
    var title = document.getElementById('recordTitle').value.trim();
    if (!text && !editingImages.length && !title) {
      alert('请输入文字或添加图片~');
      return;
    }
    var now = Date.now();
    try {
      if (editingRecordId) {
        // 编辑模式：更新已有记录
        var record = findRecord(editingRecordId);
        if (record) {
          record.title = title || '';
          record.text = text || '';
          record.images = editingImages.slice();
          record.updatedTime = now;
        } else {
          // 记录不存在，降级为新增
          records.push({
            id: now,
            title: title || '',
            text: text || '',
            images: editingImages.slice(),
            time: now
          });
        }
        editingRecordId = null;
      } else {
        // 新增模式
        records.push({
          id: now,
          title: title || '',
          text: text || '',
          images: editingImages.slice(),
          time: now
        });
      }
      saveRecords();
    } catch(e) {
      showSyncStatus('保存出错: ' + e.message, 'error');
    }
    render();
    closeModal();
  }

  // 删除记录
  function deleteRecord(id) {
    if (!confirm('确定删除这条记录吗？')) return;
    records = records.filter(function(r) { return r.id !== id; });
    saveRecords();
    render();
  }

  // 图片灯箱
  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('imageLightbox').classList.add('show');
  }
  function closeLightbox() {
    document.getElementById('imageLightbox').classList.remove('show');
  }

  // ========== 事件绑定（附带空值保护）==========
  var _el;
  _el = document.getElementById('addRecordBtn');    if (_el) _el.addEventListener('click', openModal);
  _el = document.getElementById('cancelRecord');     if (_el) _el.addEventListener('click', closeModal);
  _el = document.getElementById('recordModal');      if (_el) _el.addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  _el = document.getElementById('imageInput');       if (_el) _el.addEventListener('change', function() { if (this.files) { for (var fi = 0; fi < this.files.length; fi++) handleImage(this.files[fi]); } });
  _el = document.getElementById('recordModal');      if (_el) _el.addEventListener('paste', handlePaste);
  // 保存按钮：带防重入锁
  _el = document.getElementById('saveRecordBtn');
  if (_el && !_el._saveBound) {
    _el._saveBound = true;
    _el.addEventListener('click', function() {
      if (this._saving) return;
      this._saving = true;
      saveRecord();
      var btn = this;
      setTimeout(function() { btn._saving = false; }, 800);
    });
  }

  // 搜索图标点击展开/关闭
  var searchPopup = document.getElementById('searchPopup');
  var searchIconBtn = document.getElementById('searchIconBtn');
  var searchInput = document.getElementById('searchBar');
  if (searchIconBtn) {
    searchIconBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var isOpen = searchPopup.classList.contains('open');
      if (isOpen) {
        searchPopup.classList.remove('open');
        searchIconBtn.classList.remove('active');
      } else {
        searchPopup.classList.add('open');
        searchIconBtn.classList.add('active');
        searchInput.focus();
      }
    });
  }
  // 点击外部关闭
  document.addEventListener('click', function(e) {
    if (searchPopup && searchIconBtn && searchPopup.classList.contains('open') &&
        !searchPopup.contains(e.target) &&
        !searchIconBtn.contains(e.target)) {
      searchPopup.classList.remove('open');
      searchIconBtn.classList.remove('active');
    }
  });
  // 输入时实时过滤
  if (searchInput) {
    searchInput.addEventListener('input', function() { render(); });
    // Enter 键搜索
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); render(); searchInput.blur(); }
    });
    // Esc 关闭
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        searchPopup.classList.remove('open');
        searchIconBtn.classList.remove('active');
        searchInput.value = '';
        render();
      }
    });
  }

  // 键盘快捷键 Ctrl+Enter 保存
  _el = document.getElementById('recordText');
  if (_el) _el.addEventListener('keydown', function(e) { if (e.ctrlKey && e.key === 'Enter') saveRecord(); });

  // 删除/编辑/点击跳转 事件委托
  _el = document.getElementById('recordsContainer');
  if (_el) _el.addEventListener('click', function(e) {
    if (e.target.classList.contains('record-delete')) {
      deleteRecord(parseInt(e.target.getAttribute('data-id')));
      return;
    }
    if (e.target.classList.contains('record-edit')) {
      openModal(parseInt(e.target.getAttribute('data-id')));
      return;
    }
    if (e.target.classList.contains('record-image')) {
      openLightbox(e.target.getAttribute('data-src'));
      return;
    }
    // 搜索模式下点击卡片内容 → 跳转到该记录
    var searchTerm = searchInput.value.trim();
    if (searchTerm) {
      var card = e.target.closest('.record-card');
      if (card) {
        var targetId = card.getAttribute('data-id');
        // 清空搜索、收起搜索框、重新渲染全部
        searchPopup.classList.remove('open');
        searchIconBtn.classList.remove('active');
        searchInput.value = '';
        render();
        // 滚动到目标记录
        var targetEl = document.getElementById('record-' + targetId);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          // 高亮闪烁
          targetEl.style.transition = 'box-shadow 0.15s ease';
          targetEl.style.boxShadow = '0 0 0 3px #ff6b81';
          setTimeout(function() {
            targetEl.style.boxShadow = '';
            setTimeout(function() { targetEl.style.transition = ''; }, 150);
          }, 600);
        }
      }
    }
  });

  // 灯箱关闭
  _el = document.getElementById('imageLightbox');
  if (_el) _el.addEventListener('click', closeLightbox);

  // 跨标签同步（其他标签页修改了 records 时重新加载）
  window.addEventListener('storage', function(e) {
    if (e.key === STORAGE_KEY) {
      loadRecords();
      render();
    }
    if (e.key === TOKEN_KEY) {
      updateSyncUI();
    }
  });

  // ========== 同步设置弹窗 ==========
  _el = document.getElementById('syncSettingsBtn');
  if (_el) _el.addEventListener('click', function() {
    document.getElementById('githubToken').value = getToken();
    document.getElementById('syncFeedback').style.display = 'none';
    document.getElementById('syncModal').classList.add('show');
  });
  _el = document.getElementById('cancelSync');
  if (_el) _el.addEventListener('click', function() {
    document.getElementById('syncModal').classList.remove('show');
  });
  _el = document.getElementById('syncModal');
  if (_el) _el.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });
  _el = document.getElementById('saveSync');
  if (_el) _el.addEventListener('click', function() {
    var token = document.getElementById('githubToken').value.trim();
    if (!token) {
      document.getElementById('syncFeedback').className = 'sync-feedback error';
      document.getElementById('syncFeedback').textContent = '请输入 Token';
      document.getElementById('syncFeedback').style.display = 'block';
      return;
    }
    setToken(token);
    updateSyncUI();
    // 测试连接并加载云端数据
    showSyncStatus('测试连接中…', 'syncing');
    loadFromGitHub().then(function(ghRecords) {
      if (ghRecords !== null) {
        // 合并：云端和本地取较新
        mergeRecords(ghRecords);
        saveRecordsToLocal();
        render();
        document.getElementById('syncFeedback').className = 'sync-feedback success';
        document.getElementById('syncFeedback').textContent = '连接成功！已同步 ' + records.length + ' 条记录';
      } else if (ghRecords === null) {
        // 首次使用，推送本地数据
        document.getElementById('syncFeedback').className = 'sync-feedback success';
        document.getElementById('syncFeedback').textContent = '连接成功！首次同步 ' + records.length + ' 条记录';
        pushToGitHub();
      }
      document.getElementById('syncFeedback').style.display = 'block';
      setTimeout(function() { document.getElementById('syncModal').classList.remove('show'); }, 1500);
    }).catch(function(err) {
      document.getElementById('syncFeedback').className = 'sync-feedback error';
      document.getElementById('syncFeedback').textContent = '连接失败: ' + err.message;
      document.getElementById('syncFeedback').style.display = 'block';
      setToken('');
      updateSyncUI();
    });
  });

  // 导出按钮
  _el = document.getElementById('exportRecordsBtn');
  if (_el) _el.addEventListener('click', exportRecords);

  // 导入按钮：点击导出按钮后弹出文件选择器
  _el = document.getElementById('importRecordsBtn');
  if (_el) _el.addEventListener('click', function() {
    var input = document.getElementById('importRecordsInput');
    input.value = '';
    input.click();
  });
  _el = document.getElementById('importRecordsInput');
  if (_el) _el.addEventListener('change', function() {
    if (this.files && this.files[0]) importRecords(this.files[0]);
  });

  // 只写本地存储不触发同步（用于初始化合并）
  function saveRecordsToLocal() {
    saveToStorage().catch(function() {});
  }

  // 合并云端和本地记录（按 id 去重，保留 updatedTime/time 较新的版本）
  function mergeRecords(ghRecords) {
    if (!ghRecords || !ghRecords.length) return;
    var map = {};
    var all = records.concat(ghRecords);
    for (var i = 0; i < all.length; i++) {
      var r = all[i];
      var ver = r.updatedTime || r.time || r.id || 0;
      var exist = map[r.id];
      if (!exist) {
        map[r.id] = r;
      } else {
        var existVer = exist.updatedTime || exist.time || exist.id || 0;
        if (ver > existVer) map[r.id] = r;
      }
    }
    records = Object.values(map).sort(function(a, b) { return a.id - b.id; });
  }

  // ========== 导入导出 ==========
  // 导出本地所有记录为 JSON 文件
  function exportRecords() {
    var data = JSON.stringify(records, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var ts = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = 'records-' + ts + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  }

  // 导入 JSON 文件，与现有记录按 id 去重合并，按时间排序后同步到云端
  function importRecords(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var imported = JSON.parse(e.target.result);
        if (!Array.isArray(imported)) {
          alert('文件格式错误：应为记录数组');
          return;
        }
        // 过滤无效记录
        var valid = imported.filter(function(r) { return r && r.id; });
        if (!valid.length) {
          alert('文件中没有有效记录');
          return;
        }
        // 合并前记录数量
        var beforeCount = records.length;
        mergeRecords(valid);
        saveRecords();
        render();
        var added = records.length - beforeCount;
        var msg = '导入成功！新增 ' + added + ' 条，共 ' + records.length + ' 条记录';
        if (added > 0) {
          msg += '，正在同步到云端…';
        }
        document.getElementById('syncFeedback').className = 'sync-feedback success';
        document.getElementById('syncFeedback').textContent = msg;
        document.getElementById('syncFeedback').style.display = 'block';
        setTimeout(function() { document.getElementById('syncModal').classList.remove('show'); }, 1500);
      } catch(err) {
        alert('文件解析失败: ' + err.message);
      }
    };
    reader.onerror = function() {
      alert('文件读取失败');
    };
    reader.readAsText(file);
  }

  // 初始化：先本地加载，再尝试从云端拉取并合并
  function init() {
    updateSyncUI();
    loadRecords(); // 异步加载（IndexedDB）
    render();

    if (hasToken()) {
      loadFromGitHub().then(function(ghRecords) {
        if (ghRecords && ghRecords.length) {
          mergeRecords(ghRecords);
          saveRecordsToLocal();
          render();
        } else if (ghRecords === null && githubSha === null) {
          // 云端没有文件，推送本地数据
          pushToGitHub();
        }
      });
    }
  }

  // 暴露给内联 onclick 调用
  window._saveRecord = saveRecord;
  window.saveRecord = saveRecord;
  window.readClipboard = function() {};
  window.openAddRecordModal = function() { openModal(); };
  window.openSyncModalFn = function() {
    document.getElementById('githubToken').value = getToken();
    document.getElementById('syncFeedback').style.display = 'none';
    document.getElementById('syncModal').classList.add('show');
  };

  init();
</script>

  </body>
</html>
